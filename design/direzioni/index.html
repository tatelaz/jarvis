<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis · tre direzioni</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; grid-template-rows: auto 1fr; background: #1b1b1b; color: #ddd;
         font: 13px/1.4 "Segoe UI", system-ui, sans-serif; }
  nav { display: flex; gap: 6px; padding: 8px; background: #262626; }
  nav button { flex: 1; text-align: left; font: inherit; color: #ccc; background: #1d1d1d; border: 1px solid #333;
               border-radius: 6px; padding: 8px 12px; cursor: pointer; }
  nav button b { display: block; color: #fff; font-size: 13px; margin-bottom: 2px; }
  nav button.on { border-color: #ddd; background: #303030; }
  iframe { width: 100%; height: 100%; border: 0; background: #000; }
</style>
</head>
<body>
<nav>
  <button data-f="a-mark3.html" class="on"><b>A · Mark III</b>Un unico strumento al centro, bianco su nero, compiti come archi in orbita, voce azzurra.</button>
  <button data-f="b-strumento.html"><b>B · Strumento</b>Apparecchio di precisione: celle, monospaziato, oscilloscopio, un solo arancione.</button>
  <button data-f="c-cinema.html"><b>C · Cinema</b>Quasi niente: una linea di luce che vibra, sottotitoli da film, grana di pellicola.</button>
</nav>
<iframe id="f" src="a-mark3.html" title="Direzione"></iframe>
<script>
  document.querySelector("nav").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    document.querySelectorAll("nav button").forEach((x) => x.classList.toggle("on", x === b));
    document.getElementById("f").src = b.dataset.f;
  });
</script>
</body>
</html>
