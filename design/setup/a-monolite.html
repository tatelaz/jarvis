<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direzione A · Monolite</title>
<link rel="icon" href="icone/a-piccola.svg">
<style>
  /* Direzione A, "Monolite": la stessa famiglia della grafica Mark III. Nero vero, un bianco appena caldo e un solo
     azzurro, quello della voce. Un anello è il marchio, l'icona e il filo conduttore del primo avvio: si disegna
     all'accensione, si riempie col download, vibra con la voce. */
  :root {
    --bg: #000; --ink: #f3f2ee; --ink-2: rgba(243,242,238,.58); --ink-3: rgba(243,242,238,.3);
    --hair: rgba(243,242,238,.12); --voice: #8fd8ff; --need: #ffb547;
    --cond: "Bahnschrift", "DIN Alternate", "Segoe UI", sans-serif;
    --text: "Segoe UI Variable Display", "Segoe UI Variable Text", "Segoe UI", sans-serif;
    --mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
    --ease: cubic-bezier(.2,.7,.1,1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: #0b0b0c; color: var(--ink); font: 14px/1.45 var(--text); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }

  /* tavola */
  .board { max-width: 1180px; margin: 0 auto; padding: 36px 28px 80px; }
  .bar { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 34px; }
  .bar h1 { margin: 0; font: 600 12px/1 var(--cond); letter-spacing: .5em; }
  .bar .tools { display: flex; gap: 18px; font: 11px/1 var(--cond); letter-spacing: .2em; text-transform: uppercase; color: var(--ink-3); }
  .bar .tools button:hover { color: var(--ink); }
  section { margin-bottom: 64px; }
  section > h2 { margin: 0 0 18px; font: 500 10.5px/1 var(--cond); letter-spacing: .38em; text-transform: uppercase; color: var(--ink-3); }

  /* icona */
  .icons { display: grid; grid-template-columns: 1.1fr 1fr; gap: 20px; }
  .tile { background: #000; border: 1px solid var(--hair); border-radius: 14px; padding: 28px; }
  .hero-icon { display: grid; place-items: center; min-height: 300px; }
  .hero-icon svg { width: 220px; height: 220px; filter: drop-shadow(0 24px 40px rgba(0,0,0,.7)); }
  .sizes { display: flex; align-items: flex-end; gap: 22px; margin-bottom: 26px; }
  .sizes svg { display: block; }
  .caption { font: 11px/1.5 var(--mono); color: var(--ink-3); }
  .taskbar { margin-top: 22px; display: flex; gap: 6px; align-items: center; justify-content: center; height: 48px; border-radius: 10px;
             background: rgba(32,32,34,.86); border: 1px solid rgba(255,255,255,.06); }
  .taskbar.light { background: rgba(243,243,243,.86); border-color: rgba(0,0,0,.06); }
  .taskbar .slot { width: 40px; height: 40px; border-radius: 6px; display: grid; place-items: center; position: relative; }
  .taskbar .slot.app::after { content: ""; position: absolute; bottom: 2px; width: 16px; height: 3px; border-radius: 2px; background: var(--voice); }
  .taskbar .ghost { width: 24px; height: 24px; border-radius: 5px; background: rgba(255,255,255,.12); }
  .taskbar.light .ghost { background: rgba(0,0,0,.1); }

  /* finestre finte: si rimpiccioliscono per stare nella tavola */
  .fitbox { position: relative; }
  .fitbox > [data-fit] { transform-origin: 0 0; position: absolute; left: 0; top: 0; }
  .win { background: var(--bg); border: 1px solid rgba(243,242,238,.1); border-radius: 10px; overflow: hidden; position: relative;
         box-shadow: 0 40px 120px rgba(0,0,0,.65), 0 0 0 1px rgba(0,0,0,.8); }
  .chrome { height: 34px; display: flex; align-items: center; justify-content: space-between; padding: 0 14px 0 18px; }
  .chrome .mark { font: 600 10px/1 var(--cond); letter-spacing: .5em; }
  .chrome .ctl { display: flex; gap: 16px; color: var(--ink-3); }
  .chrome .ctl i { width: 10px; height: 10px; display: block; position: relative; }
  .chrome .ctl i.min::before { content: ""; position: absolute; left: 0; right: 0; top: 5px; height: 1px; background: currentColor; }
  .chrome .ctl i.x::before, .chrome .ctl i.x::after { content: ""; position: absolute; left: 50%; top: -2px; width: 1px; height: 14px; background: currentColor; transform: rotate(45deg); }
  .chrome .ctl i.x::after { transform: rotate(-45deg); }

  /* installatore */
  .inst { width: 560px; height: 360px; }
  .inst .body { padding: 26px 36px 0; display: grid; grid-template-columns: 96px 1fr; gap: 26px; }
  .inst h3 { margin: 6px 0 2px; font: 300 26px/1.15 var(--text); letter-spacing: -.01em; }
  .inst .sub { color: var(--ink-2); margin-bottom: 26px; }
  .field { font: 10.5px/1 var(--cond); letter-spacing: .28em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
  .path { font: 13px/1 var(--mono); color: var(--ink); padding: 0 0 10px; border-bottom: 1px solid var(--hair); margin-bottom: 12px; }
  .note { color: var(--ink-2); font-size: 12.5px; }
  .check { display: flex; align-items: center; gap: 10px; margin-top: 16px; color: var(--ink-2); font-size: 13px; }
  .check .box { width: 14px; height: 14px; border: 1px solid var(--ink-3); border-radius: 3px; position: relative; transition: background .2s, border-color .2s; }
  .check.on .box { background: var(--ink); border-color: var(--ink); }
  .check.on .box::after { content: ""; position: absolute; left: 4px; top: 1px; width: 4px; height: 8px; border: solid #000; border-width: 0 1.5px 1.5px 0; transform: rotate(45deg); }
  .inst .foot { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 36px 22px; display: flex; align-items: center; justify-content: space-between; }
  .inst .legal { font-size: 11px; color: var(--ink-3); max-width: 280px; }
  .btn { height: 36px; padding: 0 22px; border-radius: 18px; border: 1px solid var(--ink); font: 500 11px/1 var(--cond); letter-spacing: .24em; text-transform: uppercase;
         transition: background .25s, color .25s, border-color .25s; display: inline-flex; align-items: center; gap: 10px; }
  .btn.primary { background: var(--ink); color: #000; }
  .btn.primary:hover { background: #fff; }
  .btn.ghost { border-color: transparent; color: var(--ink-3); }
  .btn.ghost:hover { color: var(--ink); }
  .inst .work, .inst .done { position: absolute; inset: 34px 0 0; display: grid; place-items: center; text-align: center; opacity: 0; pointer-events: none; transition: opacity .5s; }
  .inst[data-state="work"] .body, .inst[data-state="work"] .foot, .inst[data-state="done"] .body, .inst[data-state="done"] .foot { opacity: 0; pointer-events: none; }
  .inst .body, .inst .foot { transition: opacity .4s; }
  .inst[data-state="work"] .work, .inst[data-state="done"] .done { opacity: 1; pointer-events: auto; }
  .ring-p { --p: 0; width: 120px; height: 120px; }
  .ring-p circle.v { stroke-dasharray: calc(var(--p) * 339.3) 339.3; transition: stroke-dasharray .1s linear; }
  .work .lbl { margin-top: 18px; font: 300 11px/1 var(--cond); letter-spacing: .36em; text-transform: uppercase; color: var(--ink-2); }
  .done h3 { font: 300 24px/1.2 var(--text); margin: 18px 0 22px; }

  /* primo avvio */
  .setup { width: 1040px; height: 640px; --progress: 0; }
  .stage { position: absolute; inset: 34px 0 0; }
  .halo { position: absolute; left: 50%; top: 50%; width: 560px; height: 560px; translate: -50% -50%; pointer-events: none;
          transition: transform 1.1s var(--ease), opacity 1.1s var(--ease); }
  .setup[data-current="hello"] .halo { transform: scale(1); }
  .setup:not([data-current="hello"]) .halo { transform: translateY(-272px) scale(.12); }
  .setup[data-current="done"] .halo { transform: translateY(-150px) scale(.34); }
  .halo .draw { stroke-dasharray: 1634; stroke-dashoffset: 1634; animation: draw 2.4s .3s var(--ease) forwards; }
  .halo .tick { opacity: 0; animation: fade 1.2s 1.6s forwards; }
  .halo .arc { stroke-dasharray: 260 1634; stroke-dashoffset: 1634; animation: draw-arc 1.8s 1.1s var(--ease) forwards; }
  .halo .wave { transform-origin: 280px 280px; transform: scale(calc(1 + var(--level, 0) * .05)); transition: transform .08s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes draw-arc { to { stroke-dashoffset: 1180; } }
  @keyframes fade { to { opacity: 1; } }
  [data-step] { position: absolute; inset: 96px 0 70px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
                opacity: 0; filter: blur(6px); transform: translateY(10px); pointer-events: none; transition: opacity .6s var(--ease), filter .6s var(--ease), transform .6s var(--ease); }
  [data-step="hello"], [data-step="done"] { inset: 0 0 70px; }
  [data-step].on { opacity: 1; filter: none; transform: none; pointer-events: auto; transition-delay: .18s; }
  [data-step].past { transform: translateY(-10px); }
  .kicker { font: 500 10.5px/1 var(--cond); letter-spacing: .42em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 14px; }
  .t { margin: 0; font: 200 40px/1.15 var(--text); letter-spacing: -.015em; }
  .s { margin: 12px 0 0; color: var(--ink-2); max-width: 520px; font-size: 15px; }
  .act { margin-top: 28px; display: flex; gap: 10px; justify-content: center; }
  .hello .t { font-size: 46px; margin-top: 30px; }
  .rows { margin-top: 30px; width: 520px; text-align: left; }
  .row { display: grid; grid-template-columns: 150px 1fr 18px; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--hair);
         opacity: .25; transition: opacity .5s; }
  .row.ok { opacity: 1; }
  .row .k { font: 500 10.5px/1 var(--cond); letter-spacing: .26em; text-transform: uppercase; color: var(--ink-3); }
  .row .v { font: 13px/1 var(--mono); }
  .row .ic { width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--ink-3); position: relative; transition: border-color .3s, background .3s; }
  .row.ok .ic { border-color: var(--voice); background: var(--voice); box-shadow: 0 0 12px rgba(143,216,255,.6); }
  .profile { margin-top: 22px; opacity: 0; transform: translateY(6px); transition: opacity .6s, transform .6s; }
  .profile.on { opacity: 1; transform: none; }
  .profile b { font: 500 11px/1 var(--cond); letter-spacing: .3em; text-transform: uppercase; color: var(--voice); }
  .profile span { display: block; margin-top: 6px; color: var(--ink-2); font-size: 13px; }
  .choices { margin-top: 28px; display: grid; grid-template-columns: repeat(2, 330px); gap: 12px; text-align: left; }
  .choice { position: relative; padding: 18px 20px 18px 46px; border: 1px solid var(--hair); border-radius: 12px; transition: border-color .3s, background .3s; }
  .choice::before { content: ""; position: absolute; left: 18px; top: 21px; width: 12px; height: 12px; border-radius: 50%; border: 1px solid var(--ink-3); transition: all .3s; }
  .choice.on { border-color: rgba(143,216,255,.55); background: rgba(143,216,255,.05); }
  .choice.on::before { border-color: var(--voice); background: var(--voice); box-shadow: inset 0 0 0 3px #000; }
  .choice.disabled { opacity: .38; cursor: not-allowed; }
  .choice b { display: block; font-weight: 500; margin-bottom: 4px; }
  .choice span { color: var(--ink-2); font-size: 12.5px; line-height: 1.45; }
  .choice .tag { position: absolute; right: 16px; top: -7px; padding: 0 8px; background: #000; font: 500 9.5px/14px var(--cond); letter-spacing: .22em; text-transform: uppercase; color: var(--voice); }
  .login { margin-top: 12px; font: 500 10.5px/1 var(--cond); letter-spacing: .22em; text-transform: uppercase; color: var(--ink); display: inline-flex; gap: 8px; align-items: center; }
  .login::after { content: ""; width: 18px; height: 1px; background: currentColor; transition: width .3s; }
  .login:hover::after { width: 28px; }
  .login[data-state="wait"] { color: var(--need); }
  .login[data-state="wait"]::after { animation: pulse 1s infinite; }
  .login[data-state="ok"] { color: var(--voice); }
  .login[data-state="ok"]::after { width: 0; }
  @keyframes pulse { 50% { opacity: .2; } }
  .dls { margin-top: 18px; width: 560px; text-align: left; }
  .dl { --p: 0; display: grid; grid-template-columns: 1fr auto; gap: 5px 12px; padding: 6px 0; }
  .dl[hidden] { display: none; }
  .dl .n { font-size: 13px; color: var(--ink-2); transition: color .3s; }
  .dl.done .n { color: var(--ink); }
  .dl .sz { font: 11.5px/1 var(--mono); color: var(--ink-3); }
  .dl .track { grid-column: 1 / -1; height: 1px; background: var(--hair); position: relative; }
  .dl .track::after { content: ""; position: absolute; left: 0; top: 0; height: 1px; width: calc(var(--p) * 100%); background: var(--ink); }
  .dl.done .track::after { background: var(--voice); }
  .total { --p: 0; margin-top: 18px; font: 500 11px/1 var(--cond); letter-spacing: .3em; text-transform: uppercase; color: var(--ink-2); }
  .meters { margin-top: 30px; display: grid; grid-template-columns: 260px 260px; gap: 26px; text-align: left; }
  .meter { --level: 0; }
  .meter .k { font: 500 10.5px/1 var(--cond); letter-spacing: .26em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 10px; }
  .lvl { height: 26px; background: linear-gradient(90deg, var(--ink) calc(var(--level) * 100%), var(--hair) 0); -webkit-mask: repeating-linear-gradient(90deg, #000 0 4px, transparent 4px 7px); mask: repeating-linear-gradient(90deg, #000 0 4px, transparent 4px 7px); }
  .meter.out .lvl { background: linear-gradient(90deg, var(--voice) calc(var(--level) * 100%), var(--hair) 0); }
  .line { margin-top: 26px; font: 300 20px/1.4 var(--text); color: var(--voice); opacity: 0; min-height: 28px; }
  .line.show { animation: line 2.6s var(--ease) forwards; }
  @keyframes line { 0% { opacity: 0; filter: blur(4px); } 12% { opacity: 1; filter: none; } 80% { opacity: 1; } 100% { opacity: .5; } }
  .say.on { border-color: var(--voice); color: var(--voice); }
  [data-step="done"] .t { margin-top: 230px; }
  .steps { position: absolute; left: 0; right: 0; bottom: 26px; display: flex; justify-content: center; gap: 26px; }
  .steps button { font: 500 9.5px/1 var(--cond); letter-spacing: .3em; text-transform: uppercase; color: var(--ink-3); transition: color .3s; position: relative; padding-top: 12px; }
  .steps button::before { content: ""; position: absolute; left: 50%; top: 0; width: 4px; height: 4px; border-radius: 50%; background: var(--ink-3); translate: -50% 0; transition: background .3s, box-shadow .3s; }
  .steps button.past { color: var(--ink-2); }
  .steps button.on { color: var(--ink); }
  .steps button.on::before { background: var(--voice); box-shadow: 0 0 10px var(--voice); }
  .lang { position: absolute; right: 18px; top: 46px; font: 500 10px/1 var(--cond); letter-spacing: .26em; text-transform: uppercase; color: var(--ink-3); }
  .lang:hover { color: var(--ink); }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01s !important; transition-duration: .01s !important; } }
</style>
</head>
<body>
<div class="board">
  <div class="bar">
    <h1>JARVIS</h1>
    <div class="tools"><button data-play><span data-t="board_pause"></span></button><button data-lang-switch></button></div>
  </div>

  <!-- icona -->
  <section>
    <h2 data-t="board_icon"></h2>
    <div class="icons">
      <div class="tile hero-icon">
        <svg viewBox="0 0 256 256" aria-label="Jarvis">
          <defs>
            <radialGradient id="a-glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#8fd8ff" stop-opacity=".22"/><stop offset="1" stop-color="#8fd8ff" stop-opacity="0"/></radialGradient>
            <linearGradient id="a-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16181b"/><stop offset="1" stop-color="#030304"/></linearGradient>
          </defs>
          <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#a-bg)"/>
          <rect x="8.5" y="8.5" width="239" height="239" rx="55.5" fill="none" stroke="#fff" stroke-opacity=".08"/>
          <circle cx="128" cy="128" r="92" fill="url(#a-glow)"/>
          <circle cx="128" cy="128" r="74" fill="none" stroke="#f3f2ee" stroke-opacity=".22" stroke-width="2"/>
          <circle cx="128" cy="128" r="60" fill="none" stroke="#f3f2ee" stroke-width="13" stroke-dasharray="300 77" stroke-dashoffset="-40" stroke-linecap="round" transform="rotate(-90 128 128)"/>
          <circle cx="128" cy="128" r="60" fill="none" stroke="#8fd8ff" stroke-width="13" stroke-dasharray="40 337" stroke-dashoffset="-357" stroke-linecap="round" transform="rotate(-90 128 128)"/>
          <circle cx="128" cy="128" r="9" fill="#f3f2ee"/>
        </svg>
      </div>
      <div class="tile">
        <div class="sizes" id="a-sizes"></div>
        <div class="caption" data-t="sizes"></div>
        <div class="taskbar"><span class="slot"><i class="ghost"></i></span><span class="slot"><i class="ghost"></i></span><span class="slot app" id="a-tb1"></span><span class="slot"><i class="ghost"></i></span></div>
        <div class="taskbar light"><span class="slot"><i class="ghost"></i></span><span class="slot app" id="a-tb2"></span><span class="slot"><i class="ghost"></i></span><span class="slot"><i class="ghost"></i></span></div>
      </div>
    </div>
  </section>

  <!-- installatore -->
  <section>
    <h2 data-t="board_inst"></h2>
    <div class="fitbox" style="max-width:560px"><div data-fit="560">
      <div class="win inst" data-installer data-state="ready">
        <div class="chrome"><span class="mark">JARVIS</span><span class="ctl"><i class="min"></i><i class="x"></i></span></div>
        <div class="body">
          <div class="mini-icon" id="a-inst-icon"></div>
          <div>
            <h3 data-t="inst_title"></h3>
            <div class="sub" data-t="inst_sub"></div>
            <div class="field" data-t="inst_where"></div>
            <div class="path" data-t="inst_path"></div>
            <div class="note" data-t="inst_space"></div>
            <button class="check on" data-toggle role="checkbox" aria-checked="true"><span class="box"></span><span data-t="inst_desktop"></span></button>
          </div>
        </div>
        <div class="foot"><span class="legal" data-t="inst_license"></span><span><button class="btn ghost" data-t="inst_cancel"></button> <button class="btn primary" data-install><span data-t="inst_go"></span></button></span></div>
        <div class="work"><div>
          <svg class="ring-p" viewBox="0 0 120 120"><circle cx="60" cy="60" r="54" fill="none" stroke="rgba(243,242,238,.12)" stroke-width="2"/><circle class="v" cx="60" cy="60" r="54" fill="none" stroke="#f3f2ee" stroke-width="2" stroke-linecap="round" transform="rotate(-90 60 60)"/></svg>
          <div class="lbl" data-inst-step data-t="inst_s1"></div>
        </div></div>
        <div class="done"><div>
          <svg class="ring-p" viewBox="0 0 120 120" style="--p:1"><circle class="v" cx="60" cy="60" r="54" fill="none" stroke="#8fd8ff" stroke-width="2" transform="rotate(-90 60 60)"/></svg>
          <h3 data-t="inst_done"></h3>
          <button class="btn primary" data-t="inst_open"></button>
        </div></div>
      </div>
    </div></div>
  </section>

  <!-- primo avvio -->
  <section>
    <h2 data-t="board_setup"></h2>
    <div class="fitbox"><div data-fit="1040">
      <div class="win setup" data-wizard>
        <div class="chrome"><span class="mark">JARVIS</span><span class="ctl"><i class="min"></i><i class="x"></i></span></div>
        <button class="lang" data-lang-switch></button>
        <div class="stage">
          <svg class="halo" viewBox="0 0 560 560" aria-hidden="true">
            <g class="wave" data-wave>
              <circle class="draw" cx="280" cy="280" r="260" fill="none" stroke="rgba(243,242,238,.16)" stroke-width="1"/>
              <circle class="draw" cx="280" cy="280" r="214" fill="none" stroke="#f3f2ee" stroke-width="2.2"/>
              <circle class="arc" cx="280" cy="280" r="214" fill="none" stroke="#8fd8ff" stroke-width="2.2" stroke-linecap="round" transform="rotate(-90 280 280)"/>
              <g class="tick" stroke="rgba(243,242,238,.35)"><line x1="280" y1="12" x2="280" y2="26"/><line x1="280" y1="534" x2="280" y2="548"/><line x1="12" y1="280" x2="26" y2="280"/><line x1="534" y1="280" x2="548" y2="280"/></g>
            </g>
          </svg>

          <div data-step="hello" class="hello">
            <div class="kicker" data-t="step_hello"></div>
            <h3 class="t" data-t="hello_t"></h3>
            <p class="s" data-t="hello_s"></p>
            <div class="act"><button class="btn primary" data-next><span data-t="hello_go"></span></button></div>
          </div>

          <div data-step="pc">
            <div class="kicker" data-t="step_pc"></div>
            <h3 class="t" data-t="pc_t"></h3>
            <p class="s" data-t="pc_s"></p>
            <div class="rows">
              <div class="row" data-check><span class="k" data-t="pc_os"></span><span class="v" data-t="v_os"></span><i class="ic"></i></div>
              <div class="row" data-check><span class="k" data-t="pc_gpu"></span><span class="v" data-t="v_gpu"></span><i class="ic"></i></div>
              <div class="row" data-check><span class="k" data-t="pc_ram"></span><span class="v" data-t="v_ram"></span><i class="ic"></i></div>
              <div class="row" data-check><span class="k" data-t="pc_disk"></span><span class="v" data-t="v_disk"></span><i class="ic"></i></div>
              <div class="row" data-check><span class="k" data-t="pc_mic"></span><span class="v" data-t="v_mic"></span><i class="ic"></i></div>
            </div>
            <div class="profile" data-profile><b data-t="pc_profile"></b><span data-t="pc_profile_s"></span></div>
            <div class="act"><button class="btn ghost" data-prev data-t="back"></button><button class="btn primary" data-next data-t="next"></button></div>
          </div>

          <div data-step="brain">
            <div class="kicker" data-t="step_brain"></div>
            <h3 class="t" data-t="brain_t"></h3>
            <p class="s" data-t="brain_s"></p>
            <div class="choices" data-group="brain" role="radiogroup">
              <div class="choice on" data-choice="pro" role="radio" aria-checked="true"><span class="tag" data-t="b_best"></span><b data-t="b_pro"></b><span data-t="b_pro_s"></span><br><button class="login" data-login><span data-t="b_login"></span></button></div>
              <div class="choice" data-choice="api" role="radio" aria-checked="false"><b data-t="b_api"></b><span data-t="b_api_s"></span></div>
              <div class="choice" data-choice="free" role="radio" aria-checked="false"><b data-t="b_free"></b><span data-t="b_free_s"></span></div>
              <div class="choice disabled" data-choice="local" role="radio" aria-checked="false" aria-disabled="true"><b data-t="b_local"></b><span data-t="b_local_s"></span></div>
            </div>
            <div class="act"><button class="btn ghost" data-prev data-t="back"></button><button class="btn primary" data-next data-t="next"></button></div>
          </div>

          <div data-step="voice">
            <div class="kicker" data-t="step_voice"></div>
            <h3 class="t" data-t="voice_t"></h3>
            <p class="s" data-t="voice_s"></p>
            <div class="choices" data-group="voice" role="radiogroup">
              <div class="choice on" data-choice="base" role="radio" aria-checked="true"><b data-t="vo_base"></b><span data-t="vo_base_s"></span><br><button class="login" data-say><span data-t="vo_listen"></span></button></div>
              <div class="choice" data-choice="film" role="radio" aria-checked="false"><b data-t="vo_film"></b><span data-t="vo_film_s"></span><br><button class="login" data-say><span data-t="vo_listen"></span></button></div>
            </div>
            <div class="act"><button class="btn ghost" data-prev data-t="back"></button><button class="btn primary" data-next data-t="next"></button></div>
          </div>

          <div data-step="dl">
            <div class="kicker" data-t="step_dl"></div>
            <h3 class="t" data-t="dl_t"></h3>
            <p class="s" data-t="dl_s"></p>
            <div class="dls">
              <div class="dl" data-dl="dl_engine"><span class="n" data-t="dl_engine"></span><span class="sz" data-size></span><i class="track"></i></div>
              <div class="dl" data-dl="dl_ears"><span class="n" data-t="dl_ears"></span><span class="sz" data-size></span><i class="track"></i></div>
              <div class="dl" data-dl="dl_voice"><span class="n" data-t="dl_voice"></span><span class="sz" data-size></span><i class="track"></i></div>
              <div class="dl" data-dl="dl_who"><span class="n" data-t="dl_who"></span><span class="sz" data-size></span><i class="track"></i></div>
              <div class="dl" data-dl="dl_mem"><span class="n" data-t="dl_mem"></span><span class="sz" data-size></span><i class="track"></i></div>
              <div class="dl" data-dl="dl_turn"><span class="n" data-t="dl_turn"></span><span class="sz" data-size></span><i class="track"></i></div>
              <div class="dl" data-dl="dl_film" hidden><span class="n" data-t="dl_film"></span><span class="sz" data-size></span><i class="track"></i></div>
            </div>
            <div class="total" data-total></div>
            <div class="act"><button class="btn ghost" data-prev data-t="back"></button><button class="btn primary" data-next data-t="next"></button></div>
          </div>

          <div data-step="test">
            <div class="kicker" data-t="step_test"></div>
            <h3 class="t" data-t="test_t"></h3>
            <p class="s" data-t="test_s"></p>
            <div class="meters">
              <div class="meter" data-meter="mic"><div class="k" data-t="test_mic"></div><div class="lvl"></div></div>
              <div class="meter out" data-meter="out"><div class="k" data-t="test_out"></div><div class="lvl"></div></div>
            </div>
            <div class="line" data-line data-t="test_line"></div>
            <div class="act"><button class="btn ghost" data-prev data-t="back"></button><button class="btn say" data-say><span data-t="test_play"></span></button><button class="btn primary" data-next data-t="next"></button></div>
          </div>

          <div data-step="done">
            <h3 class="t" data-t="done_t"></h3>
            <p class="s" data-t="done_s"></p>
            <button class="check on" data-toggle role="checkbox" aria-checked="true" style="margin:22px auto 0"><span class="box"></span><span data-t="done_auto"></span></button>
            <div class="act"><button class="btn primary" data-t="done_go"></button></div>
          </div>
        </div>
        <nav class="steps">
          <button data-dot data-goto="0" data-t="step_hello"></button><button data-dot data-goto="1" data-t="step_pc"></button>
          <button data-dot data-goto="2" data-t="step_brain"></button><button data-dot data-goto="3" data-t="step_voice"></button>
          <button data-dot data-goto="4" data-t="step_dl"></button><button data-dot data-goto="5" data-t="step_test"></button>
          <button data-dot data-goto="6" data-t="step_done"></button>
        </nav>
      </div>
    </div></div>
  </section>
</div>

<script>
  /* l'icona piccola è disegnata a parte: a 16-24 px l'anello sottile e il punto sparirebbero, resta solo la forma */
  const big = document.querySelector(".hero-icon svg").outerHTML;
  const small = `<svg viewBox="0 0 32 32"><rect x="1" y="1" width="30" height="30" rx="8" fill="#0b0c0e"/><circle cx="16" cy="16" r="8.5" fill="none" stroke="#f3f2ee" stroke-width="3.2" stroke-dasharray="40 13.4" stroke-dashoffset="-5" stroke-linecap="round" transform="rotate(-90 16 16)"/><circle cx="16" cy="16" r="8.5" fill="none" stroke="#8fd8ff" stroke-width="3.2" stroke-dasharray="5 48.4" stroke-dashoffset="-48" stroke-linecap="round" transform="rotate(-90 16 16)"/></svg>`;
  const sizes = document.getElementById("a-sizes");
  for (const px of [256, 64, 48, 32, 24, 16]) {
    const d = document.createElement("div");
    d.innerHTML = px >= 48 ? big : small;
    const s = d.firstElementChild;
    s.setAttribute("width", px > 128 ? 128 : px); s.setAttribute("height", px > 128 ? 128 : px);
    s.style.filter = "none";
    sizes.appendChild(s);
  }
  document.getElementById("a-tb1").innerHTML = small.replace("<svg", '<svg width="24" height="24"');
  document.getElementById("a-tb2").innerHTML = small.replace("<svg", '<svg width="24" height="24"');
  document.getElementById("a-inst-icon").innerHTML = big.replace("<svg", '<svg width="96" height="96"').replace(/a-glow|a-bg/g, (m) => m + "-i");
</script>
<script src="proto.js"></script>
</body>
</html>
