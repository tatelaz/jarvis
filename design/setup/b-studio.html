<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Direzione B · Studio</title>
<link rel="icon" href="icone/b-piccola.svg">
<style>
  /* Direzione B, "Studio": chiara, ordinata, da prodotto professionale. Carta calda, inchiostro quasi nero, un solo
     blu per ciò che si può toccare. I passi stanno in una colonna a sinistra, come un'impostazione di Windows ben
     fatta: si vede sempre dove sei e quanto manca. L'icona è l'unico pezzo scuro: sulla barra delle applicazioni,
     chiara o scura, si riconosce subito. */
  :root {
    --paper: #f7f6f3; --card: #ffffff; --ink: #16171a; --ink-2: #5d6068; --ink-3: #9a9da5; --line: #e4e2dd;
    --blue: #2452e6; --blue-soft: #e9eefc; --ok: #1f9d6b; --need: #b86e00;
    --text: "Segoe UI Variable Text", "Segoe UI", sans-serif;
    --display: "Segoe UI Variable Display", "Segoe UI", sans-serif;
    --mono: "Cascadia Mono", Consolas, ui-monospace, monospace;
    --ease: cubic-bezier(.2,.7,.1,1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: #eceae5; color: var(--ink); font: 14px/1.5 var(--text); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }

  .board { max-width: 1180px; margin: 0 auto; padding: 36px 28px 80px; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
  .bar h1 { margin: 0; font: 600 15px/1 var(--display); letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
  .bar .tools { display: flex; gap: 6px; }
  .bar .tools button { height: 30px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); font-size: 12.5px; color: var(--ink-2); }
  .bar .tools button:hover { color: var(--ink); border-color: #cfccc5; }
  section { margin-bottom: 56px; }
  section > h2 { margin: 0 0 14px; font: 600 12.5px/1 var(--display); color: var(--ink-2); }

  .icons { display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 28px; }
  .hero-icon { display: grid; place-items: center; min-height: 300px; background: radial-gradient(circle at 50% 40%, #fff, #f1efea); }
  .hero-icon svg { width: 220px; height: 220px; filter: drop-shadow(0 18px 30px rgba(20,24,40,.25)); }
  .sizes { display: flex; align-items: flex-end; gap: 22px; margin-bottom: 22px; }
  .caption { font: 12px/1.5 var(--text); color: var(--ink-3); }
  .taskbar { margin-top: 18px; display: flex; gap: 6px; align-items: center; justify-content: center; height: 48px; border-radius: 10px; background: rgba(32,32,34,.92); }
  .taskbar.light { background: rgba(243,243,243,.95); border: 1px solid var(--line); }
  .taskbar .slot { width: 40px; height: 40px; border-radius: 6px; display: grid; place-items: center; position: relative; }
  .taskbar .slot.app { background: rgba(255,255,255,.08); }
  .taskbar.light .slot.app { background: rgba(0,0,0,.05); }
  .taskbar .slot.app::after { content: ""; position: absolute; bottom: 2px; width: 16px; height: 3px; border-radius: 2px; background: var(--blue); }
  .taskbar .ghost { width: 24px; height: 24px; border-radius: 5px; background: rgba(255,255,255,.14); }
  .taskbar.light .ghost { background: rgba(0,0,0,.1); }

  .fitbox { position: relative; }
  .fitbox > [data-fit] { transform-origin: 0 0; position: absolute; left: 0; top: 0; }
  .win { background: var(--paper); border-radius: 10px; overflow: hidden; position: relative;
         box-shadow: 0 30px 80px rgba(20,22,30,.18), 0 0 0 1px rgba(20,22,30,.08); }
  .chrome { height: 36px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 16px; }
  .chrome .mark { display: flex; align-items: center; gap: 8px; font: 600 12px/1 var(--display); }
  .chrome .ctl { display: flex; gap: 18px; color: var(--ink-3); }
  .chrome .ctl i { width: 10px; height: 10px; display: block; position: relative; }
  .chrome .ctl i.min::before { content: ""; position: absolute; left: 0; right: 0; top: 5px; height: 1px; background: currentColor; }
  .chrome .ctl i.x::before, .chrome .ctl i.x::after { content: ""; position: absolute; left: 50%; top: -2px; width: 1px; height: 14px; background: currentColor; transform: rotate(45deg); }
  .chrome .ctl i.x::after { transform: rotate(-45deg); }

  .btn { height: 36px; padding: 0 18px; border-radius: 8px; font: 600 13px/1 var(--text); display: inline-flex; align-items: center; gap: 8px;
         transition: background .2s, box-shadow .2s, transform .15s; }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--blue); color: #fff; box-shadow: 0 1px 0 rgba(255,255,255,.2) inset, 0 4px 14px rgba(36,82,230,.28); }
  .btn.primary:hover { background: #1e46cc; }
  .btn.ghost { color: var(--ink-2); }
  .btn.ghost:hover { background: rgba(0,0,0,.05); color: var(--ink); }
  .btn.outline { border: 1px solid var(--line); background: var(--card); }
  .btn.outline.on { border-color: var(--blue); color: var(--blue); }

  /* installatore */
  .inst { width: 560px; height: 380px; }
  .inst .body { padding: 18px 32px 0; display: grid; grid-template-columns: 72px 1fr; gap: 22px; transition: opacity .3s; }
  .inst h3 { margin: 4px 0 0; font: 600 22px/1.2 var(--display); letter-spacing: -.01em; }
  .inst .sub { color: var(--ink-2); margin-bottom: 20px; }
  .field { font: 600 12px/1 var(--text); color: var(--ink-2); margin-bottom: 6px; }
  .path { display: flex; align-items: center; justify-content: space-between; height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card);
          font: 12.5px/1 var(--mono); color: var(--ink); margin-bottom: 10px; }
  .path::after { content: "…"; color: var(--ink-3); }
  .note { color: var(--ink-2); font-size: 12.5px; }
  .check { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 13px; color: var(--ink); }
  .check .box { width: 18px; height: 18px; border: 1.5px solid #b9b6ae; border-radius: 5px; position: relative; transition: background .2s, border-color .2s; background: var(--card); }
  .check.on .box { background: var(--blue); border-color: var(--blue); }
  .check.on .box::after { content: ""; position: absolute; left: 5px; top: 1.5px; width: 5px; height: 9px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .inst .foot { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 20px; display: flex; align-items: center; justify-content: space-between;
                border-top: 1px solid var(--line); background: var(--card); transition: opacity .3s; }
  .inst .legal { font-size: 11.5px; color: var(--ink-3); max-width: 300px; line-height: 1.4; }
  .inst .work, .inst .done { position: absolute; inset: 36px 0 0; padding: 0 40px; display: flex; flex-direction: column; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .4s; }
  .inst[data-state="work"] .body, .inst[data-state="work"] .foot, .inst[data-state="done"] .body, .inst[data-state="done"] .foot { opacity: 0; pointer-events: none; }
  .inst[data-state="work"] .work, .inst[data-state="done"] .done { opacity: 1; pointer-events: auto; }
  .inst .work h3, .inst .done h3 { margin-bottom: 18px; }
  .pbar { --p: 0; height: 6px; border-radius: 3px; background: #e7e4de; overflow: hidden; }
  .pbar::after { content: ""; display: block; height: 100%; width: calc(var(--p) * 100%); background: var(--blue); border-radius: 3px; }
  .inst .work .lbl { margin-top: 12px; font-size: 13px; color: var(--ink-2); }
  .tickmark { width: 44px; height: 44px; border-radius: 50%; background: #e3f4ec; display: grid; place-items: center; margin-bottom: 16px; }
  .tickmark svg path { stroke-dasharray: 24; stroke-dashoffset: 24; }
  .inst[data-state="done"] .tickmark svg path, .setup[data-current="done"] .tickmark svg path { animation: tick .6s .2s var(--ease) forwards; }
  @keyframes tick { to { stroke-dashoffset: 0; } }

  /* primo avvio */
  .setup { width: 1040px; height: 640px; display: grid; grid-template-columns: 250px 1fr; grid-template-rows: 36px 1fr; --progress: 0; }
  .setup .chrome { grid-column: 1 / -1; border-bottom: 1px solid var(--line); background: var(--paper); }
  .side { border-right: 1px solid var(--line); padding: 26px 18px; display: flex; flex-direction: column; background: #f2f0ec; }
  .side nav { display: flex; flex-direction: column; gap: 2px; }
  .side nav button { display: flex; align-items: center; gap: 12px; height: 38px; padding: 0 10px; border-radius: 8px; text-align: left; color: var(--ink-3); font-size: 13.5px;
                     transition: background .25s, color .25s; }
  .side nav button .n { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid #cfccc5; display: grid; place-items: center; font: 600 11px/1 var(--text); color: var(--ink-3);
                        transition: all .3s var(--ease); flex: none; }
  .side nav button.past { color: var(--ink-2); }
  .side nav button.past .n { background: var(--ink); border-color: var(--ink); color: transparent; position: relative; }
  .side nav button.past .n::after { content: ""; position: absolute; left: 7.5px; top: 4px; width: 4px; height: 8px; border: solid #fff; border-width: 0 1.6px 1.6px 0; transform: rotate(45deg); }
  .side nav button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 0 0 1px var(--line); }
  .side nav button.on .n { border-color: var(--blue); color: var(--blue); }
  .side .meta { margin-top: auto; font-size: 12px; color: var(--ink-3); }
  .side .meta .pbar { margin-top: 8px; height: 4px; --p: var(--progress); }
  .side .lang { margin-top: 14px; font-size: 12.5px; color: var(--ink-2); text-decoration: underline; text-underline-offset: 3px; text-decoration-color: #cfccc5; }
  .main { position: relative; overflow: hidden; }
  [data-step] { position: absolute; inset: 0; padding: 44px 56px 90px; opacity: 0; transform: translateX(18px); pointer-events: none;
                transition: opacity .45s var(--ease), transform .45s var(--ease); display: flex; flex-direction: column; }
  [data-step].on { opacity: 1; transform: none; pointer-events: auto; transition-delay: .1s; }
  [data-step].past { transform: translateX(-18px); }
  .eyebrow { font: 600 12px/1 var(--text); color: var(--blue); margin-bottom: 10px; }
  .t { margin: 0; font: 600 30px/1.2 var(--display); letter-spacing: -.02em; }
  .s { margin: 8px 0 0; color: var(--ink-2); font-size: 15px; max-width: 560px; }
  .content { margin-top: 26px; }
  .footer { position: absolute; left: 56px; right: 56px; bottom: 28px; display: flex; justify-content: space-between; align-items: center; }
  .hello-art { position: absolute; right: 48px; top: 40px; width: 300px; height: 300px; opacity: .9; }
  .hello-art circle { transform-origin: 150px 150px; animation: breathe 6s ease-in-out infinite; }
  .hello-art circle:nth-child(2) { animation-delay: -2s; } .hello-art circle:nth-child(3) { animation-delay: -4s; }
  @keyframes breathe { 50% { transform: scale(1.06); opacity: .5; } }
  [data-step="hello"] .t { font-size: 40px; margin-top: 120px; }
  .rows { border: 1px solid var(--line); border-radius: 12px; background: var(--card); overflow: hidden; max-width: 620px; }
  .row { display: grid; grid-template-columns: 160px 1fr 20px; align-items: center; height: 46px; padding: 0 18px; border-bottom: 1px solid var(--line); }
  .row:last-child { border-bottom: 0; }
  .row .k { color: var(--ink-2); font-size: 13px; }
  .row .v { font-size: 13.5px; opacity: 0; transform: translateX(-4px); transition: opacity .35s, transform .35s; }
  .row .ic { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #e2dfd8; border-top-color: var(--blue); animation: spin .8s linear infinite; }
  .row.ok .v { opacity: 1; transform: none; }
  .row.ok .ic { animation: none; border-color: var(--ok); background: var(--ok); position: relative; }
  .row.ok .ic::after { content: ""; position: absolute; left: 5px; top: 2px; width: 3.5px; height: 7px; border: solid #fff; border-width: 0 1.6px 1.6px 0; transform: rotate(45deg); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .profile { margin-top: 16px; max-width: 620px; display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 12px; background: var(--blue-soft);
             opacity: 0; transform: translateY(6px); transition: opacity .5s, transform .5s; }
  .profile.on { opacity: 1; transform: none; }
  .profile b { color: var(--blue); font-weight: 600; white-space: nowrap; }
  .profile span { color: #3b4a73; font-size: 13px; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 680px; }
  .choice { position: relative; padding: 16px 18px 16px 50px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); cursor: pointer;
            transition: border-color .2s, box-shadow .2s; }
  .choice:hover { border-color: #cfccc5; }
  .choice::before { content: ""; position: absolute; left: 18px; top: 18px; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid #b9b6ae; background: #fff; transition: all .2s; }
  .choice.on { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(36,82,230,.12); }
  .choice.on::before { border-color: var(--blue); background: var(--blue); box-shadow: inset 0 0 0 4px #fff; }
  .choice.disabled { opacity: .5; cursor: not-allowed; background: transparent; }
  .choice b { display: block; font-weight: 600; margin-bottom: 3px; }
  .choice span { color: var(--ink-2); font-size: 12.5px; line-height: 1.45; display: block; }
  .choice .tag { position: absolute; right: 12px; top: 12px; height: 20px; padding: 0 8px; border-radius: 10px; background: var(--blue-soft); color: var(--blue); font: 600 11px/20px var(--text); }
  .choice .tag + b { padding-right: 96px; }
  .login { margin-top: 12px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); font-weight: 600; font-size: 12.5px; display: inline-flex; align-items: center; gap: 8px; background: #fff; }
  .login::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #c9c6be; transition: background .3s; }
  .login[data-state="wait"]::before { background: var(--need); animation: blink 1s infinite; }
  .login[data-state="ok"] { border-color: #bfe3d2; color: var(--ok); }
  .login[data-state="ok"]::before { background: var(--ok); }
  @keyframes blink { 50% { opacity: .3; } }
  .dls { max-width: 640px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); padding: 6px 18px; }
  .dl { --p: 0; display: grid; grid-template-columns: 1fr auto; gap: 7px 12px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .dl:last-child { border-bottom: 0; }
  .dl[hidden] { display: none; }
  .dl .n { font-size: 13.5px; }
  .dl .sz { font: 12px/1.4 var(--mono); color: var(--ink-3); }
  .dl.done .sz { color: var(--ok); font-family: var(--text); font-weight: 600; }
  .dl .track { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: #eeebe5; overflow: hidden; }
  .dl .track::after { content: ""; display: block; height: 100%; width: calc(var(--p) * 100%); background: var(--blue); border-radius: 2px; transition: background .3s; }
  .dl.done .track::after { background: var(--ok); }
  .total { --p: 0; font-size: 13px; color: var(--ink-2); }
  .meters { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; max-width: 640px; }
  .meter { --level: 0; padding: 16px 18px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
  .meter .k { font-size: 13px; color: var(--ink-2); margin-bottom: 12px; }
  .lvl { height: 22px; background: linear-gradient(90deg, var(--ink) calc(var(--level) * 100%), #e9e6e0 0); border-radius: 4px;
         -webkit-mask: repeating-linear-gradient(90deg, #000 0 5px, transparent 5px 8px); mask: repeating-linear-gradient(90deg, #000 0 5px, transparent 5px 8px); }
  .meter.out .lvl { background: linear-gradient(90deg, var(--blue) calc(var(--level) * 100%), #e9e6e0 0); }
  .line { margin-top: 18px; max-width: 640px; padding: 14px 18px; border-radius: 12px; background: #16171a; color: #fff; font-size: 15px; opacity: 0; transform: translateY(4px); }
  .line.show { animation: line 2.6s var(--ease) forwards; }
  @keyframes line { 10%, 85% { opacity: 1; transform: none; } 100% { opacity: .55; transform: none; } }
  .say.on { border-color: var(--blue); color: var(--blue); }
  [data-step="done"] { align-items: flex-start; }
  [data-step="done"] .tickmark { width: 64px; height: 64px; margin-top: 90px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01s !important; transition-duration: .01s !important; } }
</style>
</head>
<body>
<div class="board">
  <div class="bar">
    <h1><span id="b-mark"></span>Jarvis</h1>
    <div class="tools"><button data-play><span data-t="board_pause"></span></button><button data-lang-switch></button></div>
  </div>

  <section>
    <h2 data-t="board_icon"></h2>
    <div class="icons">
      <div class="tile hero-icon">
        <svg viewBox="0 0 256 256" aria-label="Jarvis">
          <defs>
            <linearGradient id="b-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a2f3d"/><stop offset="1" stop-color="#0d0f15"/></linearGradient>
            <linearGradient id="b-j" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9deea"/></linearGradient>
          </defs>
          <rect x="8" y="8" width="240" height="240" rx="58" fill="url(#b-bg)"/>
          <rect x="8.5" y="8.5" width="239" height="239" rx="57.5" fill="none" stroke="#fff" stroke-opacity=".1"/>
          <path d="M150 74 V146 a38 38 0 0 1 -76 0" fill="none" stroke="url(#b-j)" stroke-width="26" stroke-linecap="round"/>
          <rect x="174" y="74" width="10" height="72" rx="5" fill="#4b7bff" opacity=".9"/>
          <rect x="194" y="92" width="10" height="36" rx="5" fill="#4b7bff" opacity=".6"/>
        </svg>
      </div>
      <div class="tile">
        <div class="sizes" id="b-sizes"></div>
        <div class="caption" data-t="sizes"></div>
        <div class="taskbar"><span class="slot"><i class="ghost"></i></span><span class="slot"><i class="ghost"></i></span><span class="slot app" id="b-tb1"></span><span class="slot"><i class="ghost"></i></span></div>
        <div class="taskbar light"><span class="slot"><i class="ghost"></i></span><span class="slot app" id="b-tb2"></span><span class="slot"><i class="ghost"></i></span><span class="slot"><i class="ghost"></i></span></div>
      </div>
    </div>
  </section>

  <section>
    <h2 data-t="board_inst"></h2>
    <div class="fitbox" style="max-width:560px"><div data-fit="560">
      <div class="win inst" data-installer data-state="ready">
        <div class="chrome"><span class="mark"><span class="b-small"></span>Jarvis</span><span class="ctl"><i class="min"></i><i class="x"></i></span></div>
        <div class="body">
          <div id="b-inst-icon"></div>
          <div>
            <h3 data-t="inst_title"></h3>
            <div class="sub" data-t="inst_sub"></div>
            <div class="field" data-t="inst_where"></div>
            <div class="path"><span data-t="inst_path"></span></div>
            <div class="note" data-t="inst_space"></div>
            <button class="check on" data-toggle role="checkbox" aria-checked="true"><span class="box"></span><span data-t="inst_desktop"></span></button>
          </div>
        </div>
        <div class="foot"><span class="legal" data-t="inst_license"></span><span><button class="btn ghost" data-t="inst_cancel"></button> <button class="btn primary" data-install><span data-t="inst_go"></span></button></span></div>
        <div class="work"><h3 data-t="inst_title"></h3><div class="pbar"></div><div class="lbl" data-inst-step data-t="inst_s1"></div></div>
        <div class="done">
          <div class="tickmark"><svg width="22" height="22" viewBox="0 0 22 22"><path d="M5 11.5 9.2 15.5 17 7" fill="none" stroke="#1f9d6b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
          <h3 data-t="inst_done"></h3>
          <div><button class="btn primary" data-t="inst_open"></button></div>
        </div>
      </div>
    </div></div>
  </section>

  <section>
    <h2 data-t="board_setup"></h2>
    <div class="fitbox"><div data-fit="1040">
      <div class="win setup" data-wizard>
        <div class="chrome"><span class="mark"><span class="b-small"></span>Jarvis</span><span class="ctl"><i class="min"></i><i class="x"></i></span></div>
        <aside class="side">
          <nav>
            <button data-dot data-goto="0"><span class="n">1</span><span data-t="step_hello"></span></button>
            <button data-dot data-goto="1"><span class="n">2</span><span data-t="step_pc"></span></button>
            <button data-dot data-goto="2"><span class="n">3</span><span data-t="step_brain"></span></button>
            <button data-dot data-goto="3"><span class="n">4</span><span data-t="step_voice"></span></button>
            <button data-dot data-goto="4"><span class="n">5</span><span data-t="step_dl"></span></button>
            <button data-dot data-goto="5"><span class="n">6</span><span data-t="step_test"></span></button>
            <button data-dot data-goto="6"><span class="n">7</span><span data-t="step_done"></span></button>
          </nav>
          <div class="meta"><div class="pbar"></div><button class="lang" data-lang-switch></button></div>
        </aside>
        <div class="main">
          <div data-step="hello">
            <svg class="hello-art" viewBox="0 0 300 300" aria-hidden="true">
              <circle cx="150" cy="150" r="70" fill="none" stroke="#2452e6" stroke-opacity=".35" stroke-width="1.5"/>
              <circle cx="150" cy="150" r="105" fill="none" stroke="#2452e6" stroke-opacity=".2" stroke-width="1.5"/>
              <circle cx="150" cy="150" r="140" fill="none" stroke="#2452e6" stroke-opacity=".1" stroke-width="1.5"/>
            </svg>
            <h3 class="t" data-t="hello_t"></h3>
            <p class="s" data-t="hello_s"></p>
            <div class="footer"><span></span><button class="btn primary" data-next><span data-t="hello_go"></span></button></div>
          </div>
          <div data-step="pc">
            <div class="eyebrow" data-t="step_pc"></div>
            <h3 class="t" data-t="pc_t"></h3>
            <p class="s" data-t="pc_s"></p>
            <div class="content">
              <div class="rows">
                <div class="row" data-check><span class="k" data-t="pc_os"></span><span class="v" data-t="v_os"></span><i class="ic"></i></div>
                <div class="row" data-check><span class="k" data-t="pc_gpu"></span><span class="v" data-t="v_gpu"></span><i class="ic"></i></div>
                <div class="row" data-check><span class="k" data-t="pc_ram"></span><span class="v" data-t="v_ram"></span><i class="ic"></i></div>
                <div class="row" data-check><span class="k" data-t="pc_disk"></span><span class="v" data-t="v_disk"></span><i class="ic"></i></div>
                <div class="row" data-check><span class="k" data-t="pc_mic"></span><span class="v" data-t="v_mic"></span><i class="ic"></i></div>
              </div>
              <div class="profile" data-profile><b data-t="pc_profile"></b><span data-t="pc_profile_s"></span></div>
            </div>
            <div class="footer"><button class="btn ghost" data-prev data-t="back"></button><button class="btn primary" data-next data-t="next"></button></div>
          </div>
          <div data-step="brain">
            <div class="eyebrow" data-t="step_brain"></div>
            <h3 class="t" data-t="brain_t"></h3>
            <p class="s" data-t="brain_s"></p>
            <div class="content choices" data-group="brain" role="radiogroup">
              <div class="choice on" data-choice="pro" role="radio" aria-checked="true"><span class="tag" data-t="b_best"></span><b data-t="b_pro"></b><span data-t="b_pro_s"></span><button class="login" data-login><span data-t="b_login"></span></button></div>
              <div class="choice" data-choice="api" role="radio" aria-checked="false"><b data-t="b_api"></b><span data-t="b_api_s"></span></div>
              <div class="choice" data-choice="free" role="radio" aria-checked="false"><b data-t="b_free"></b><span data-t="b_free_s"></span></div>
              <div class="choice disabled" data-choice="local" role="radio" aria-checked="false" aria-disabled="true"><b data-t="b_local"></b><span data-t="b_local_s"></span></div>
            </div>
            <div class="footer"><button class="btn ghost" data-prev data-t="back"></button><button class="btn primary" data-next data-t="next"></button></div>
          </div>
          <div data-step="voice">
            <div class="eyebrow" data-t="step_voice"></div>
            <h3 class="t" data-t="voice_t"></h3>
            <p class="s" data-t="voice_s"></p>
            <div class="content choices" data-group="voice" role="radiogroup">
              <div class="choice on" data-choice="base" role="radio" aria-checked="true"><b data-t="vo_base"></b><span data-t="vo_base_s"></span><button class="login" data-say><span data-t="vo_listen"></span></button></div>
              <div class="choice" data-choice="film" role="radio" aria-checked="false"><b data-t="vo_film"></b><span data-t="vo_film_s"></span><button class="login" data-say><span data-t="vo_listen"></span></button></div>
            </div>
            <div class="footer"><button class="btn ghost" data-prev data-t="back"></button><button class="btn primary" data-next data-t="next"></button></div>
          </div>
          <div data-step="dl">
            <div class="eyebrow" data-t="step_dl"></div>
            <h3 class="t" data-t="dl_t"></h3>
            <p class="s" data-t="dl_s"></p>
            <div class="content dls">
              <div class="dl" data-dl="dl_engine"><span class="n" data-t="dl_engine"></span><span class="sz" data-size></span><i class="track"></i></div>
              <div class="dl" data-dl="dl_ears"><span class="n" data-t="dl_ears"></span><span class="sz" data-size></span><i class="track"></i></div>
              <div class="dl" data-dl="dl_voice"><span class="n" data-t="dl_voice"></span><span class="sz" data-size></span><i class="track"></i></div>
              <div class="dl" data-dl="dl_who"><span class="n" data-t="dl_who"></span><span class="sz" data-size></span><i class="track"></i></div>
              <div class="dl" data-dl="dl_mem"><span class="n" data-t="dl_mem"></span><span class="sz" data-size></span><i class="track"></i></div>
              <div class="dl" data-dl="dl_turn"><span class="n" data-t="dl_turn"></span><span class="sz" data-size></span><i class="track"></i></div>
              <div class="dl" data-dl="dl_film" hidden><span class="n" data-t="dl_film"></span><span class="sz" data-size></span><i class="track"></i></div>
            </div>
            <div class="footer"><span class="total" data-total></span><span><button class="btn ghost" data-prev data-t="back"></button> <button class="btn primary" data-next data-t="next"></button></span></div>
          </div>
          <div data-step="test">
            <div class="eyebrow" data-t="step_test"></div>
            <h3 class="t" data-t="test_t"></h3>
            <p class="s" data-t="test_s"></p>
            <div class="content">
              <div class="meters">
                <div class="meter" data-meter="mic"><div class="k" data-t="test_mic"></div><div class="lvl"></div></div>
                <div class="meter out" data-meter="out"><div class="k" data-t="test_out"></div><div class="lvl"></div></div>
              </div>
              <div class="line" data-line data-t="test_line"></div>
            </div>
            <div class="footer"><button class="btn ghost" data-prev data-t="back"></button><span><button class="btn outline say" data-say><span data-t="test_play"></span></button> <button class="btn primary" data-next data-t="next"></button></span></div>
          </div>
          <div data-step="done">
            <div class="tickmark"><svg width="30" height="30" viewBox="0 0 22 22"><path d="M5 11.5 9.2 15.5 17 7" fill="none" stroke="#1f9d6b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
            <h3 class="t" data-t="done_t"></h3>
            <p class="s" data-t="done_s"></p>
            <button class="check on" data-toggle role="checkbox" aria-checked="true"><span class="box"></span><span data-t="done_auto"></span></button>
            <div class="footer"><span></span><button class="btn primary" data-t="done_go"></button></div>
          </div>
        </div>
      </div>
    </div></div>
  </section>
</div>
<script>
  /* a 16-32 px il "J" resta, le barre della voce spariscono: sotto i 48 px servono solo forma e contrasto */
  const big = document.querySelector(".hero-icon svg").outerHTML;
  const small = `<svg viewBox="0 0 32 32"><rect x="1" y="1" width="30" height="30" rx="8" fill="#1a1e29"/><path d="M19 8.5V18a5 5 0 0 1-10 0" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/><rect x="22.6" y="9" width="2.6" height="9" rx="1.3" fill="#4b7bff"/></svg>`;
  const sizes = document.getElementById("b-sizes");
  for (const px of [256, 64, 48, 32, 24, 16]) {
    const d = document.createElement("div");
    d.innerHTML = px >= 48 ? big : small;
    const s = d.firstElementChild;
    s.setAttribute("width", px > 128 ? 128 : px); s.setAttribute("height", px > 128 ? 128 : px);
    s.style.filter = "none";
    sizes.appendChild(s);
  }
  for (const id of ["b-tb1", "b-tb2"]) document.getElementById(id).innerHTML = small.replace("<svg", '<svg width="24" height="24"');
  for (const el of document.querySelectorAll(".b-small, #b-mark")) el.innerHTML = small.replace("<svg", '<svg width="18" height="18" style="display:block"');
  document.getElementById("b-inst-icon").innerHTML = big.replace("<svg", '<svg width="72" height="72"');
</script>
<script src="proto.js"></script>
</body>
</html>
