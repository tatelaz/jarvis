<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis · primo avvio, tre direzioni</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; grid-template-rows: auto 1fr; background: #1b1b1b; color: #ddd; font: 13px/1.4 "Segoe UI", system-ui, sans-serif; }
  nav { display: flex; gap: 6px; padding: 8px; background: #262626; }
  nav button { flex: 1; display: flex; gap: 12px; align-items: center; text-align: left; font: inherit; color: #ccc; background: #1d1d1d;
               border: 1px solid #333; border-radius: 6px; padding: 8px 12px; cursor: pointer; }
  nav button img { width: 32px; height: 32px; flex: none; }
  nav button b { display: block; color: #fff; font-size: 13px; margin-bottom: 2px; }
  nav button.on { border-color: #ddd; background: #303030; }
  iframe { width: 100%; height: 100%; border: 0; background: #000; }
</style>
</head>
<body>
<nav>
  <button data-f="a-monolite.html" class="on"><img src="icone/a.svg" alt=""><span><b>A · Monolite</b>Dalla grafica Mark III: nero, bianco caldo, un solo azzurro. L'anello si disegna, si riempie, vibra con la voce.</span></button>
  <button data-f="b-studio.html"><img src="icone/b.svg" alt=""><span><b>B · Studio</b>Chiara e ordinata, da prodotto professionale: passi in colonna, schede, un solo blu.</span></button>
  <button data-f="c-cinema.html"><img src="icone/c.svg" alt=""><span><b>C · Cinema</b>Dalla grafica Cinema: nero caldo, una linea di luce, titoli con le grazie, dettagli come titoli di coda.</span></button>
</nav>
<iframe id="f" src="a-monolite.html" title="Direzione"></iframe>
<script>
  /* ogni direzione parte nella lingua del PC; in alto a destra si passa da italiano a inglese */
  document.querySelector("nav").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    document.querySelectorAll("nav button").forEach((x) => x.classList.toggle("on", x === b));
    document.getElementById("f").src = b.dataset.f;
  });
</script>
</body>
</html>
