<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Icona di Jarvis (Monolite): l'anello è la voce, il tratto azzurro è il punto in cui ascolta.
       Per 32 px e meno c'è icona-piccola.svg, disegnata apposta per restare leggibile. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#8fd8ff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#8fd8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16181b"/>
      <stop offset="1" stop-color="#030304"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="55.5" fill="none" stroke="#fff" stroke-opacity=".08"/>
  <circle cx="128" cy="128" r="92" fill="url(#glow)"/>
  <circle cx="128" cy="128" r="74" fill="none" stroke="#f3f2ee" stroke-opacity=".22" stroke-width="2"/>
  <circle cx="128" cy="128" r="60" fill="none" stroke="#f3f2ee" stroke-width="13" stroke-dasharray="300 77"
          stroke-dashoffset="-40" stroke-linecap="round" transform="rotate(-90 128 128)"/>
  <circle cx="128" cy="128" r="60" fill="none" stroke="#8fd8ff" stroke-width="13" stroke-dasharray="40 337"
          stroke-dashoffset="-357" stroke-linecap="round" transform="rotate(-90 128 128)"/>
  <circle cx="128" cy="128" r="9" fill="#f3f2ee"/>
</svg>
