<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<!-- icona dentro la pagina: niente richiesta di favicon.ico -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='8' fill='%230b0c0e'/%3E%3Ccircle cx='16' cy='16' r='8.5' fill='none' stroke='%23f3f2ee' stroke-width='3.2'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/setup.css">
</head>
<body data-current="hello">
<!-- la finestra è senza bordi: da questa fascia in alto si sposta (la classe la riconosce pywebview) -->
<header class="chrome pywebview-drag-region">
  <span class="mark">JARVIS</span>
  <span class="ctl">
    <button class="lang" id="lang" type="button"></button>
    <button class="close" id="close" type="button" data-t-title="close"><i></i></button>
  </span>
</header>

<main class="stage">
  <svg class="halo" viewBox="0 0 560 560" aria-hidden="true">
    <circle class="draw" cx="280" cy="280" r="260" fill="none" stroke="rgba(243,242,238,.16)" stroke-width="1"/>
    <circle class="draw" cx="280" cy="280" r="214" fill="none" stroke="#f3f2ee" stroke-width="2.2"/>
    <circle class="arc" cx="280" cy="280" r="214" fill="none" stroke="#8fd8ff" stroke-width="2.2" stroke-linecap="round" transform="rotate(-90 280 280)"/>
    <circle class="fill" cx="280" cy="280" r="214" fill="none" stroke="#8fd8ff" stroke-width="6" stroke-linecap="round" transform="rotate(-90 280 280)"/>
    <g class="tick" stroke="rgba(243,242,238,.35)"><line x1="280" y1="12" x2="280" y2="26"/><line x1="280" y1="534" x2="280" y2="548"/><line x1="12" y1="280" x2="26" y2="280"/><line x1="534" y1="280" x2="548" y2="280"/></g>
  </svg>

  <section data-step="hello" class="hello">
    <div class="kicker" data-t="step_hello"></div>
    <h1 class="t" data-t="hello_t"></h1>
    <p class="s" data-t="hello_s"></p>
    <div class="act"><button class="btn primary" data-next type="button" data-t="hello_go"></button></div>
  </section>

  <section data-step="pc">
    <div class="kicker" data-t="step_pc"></div>
    <h1 class="t" data-t="pc_t"></h1>
    <p class="s" data-t="pc_s"></p>
    <div class="rows" id="rows">
      <div class="row" data-row="gpu"><span class="k" data-t="pc_gpu"></span><span class="v"></span><i class="ic"></i></div>
      <div class="row" data-row="ram"><span class="k" data-t="pc_ram"></span><span class="v"></span><i class="ic"></i></div>
      <div class="row" data-row="disk"><span class="k" data-t="pc_disk"></span><span class="v"></span><i class="ic"></i></div>
      <div class="row" data-row="audio"><span class="k" data-t="pc_audio"></span><span class="v"></span><i class="ic"></i></div>
      <div class="row" data-row="net"><span class="k" data-t="pc_net"></span><span class="v"></span><i class="ic"></i></div>
    </div>
    <div class="profile" id="profile"><b></b><span></span><ul class="notes"></ul></div>
    <div class="act">
      <button class="btn ghost" data-prev type="button" data-t="back"></button>
      <button class="btn ghost" id="pc-again" type="button" data-t="again" hidden></button>
      <button class="btn primary" data-next type="button" data-t="next" disabled></button>
    </div>
  </section>

  <section data-step="brain">
    <div class="kicker" data-t="step_brain"></div>
    <h1 class="t" data-t="brain_t"></h1>
    <p class="s" data-t="brain_s"></p>
    <div class="choices" role="radiogroup">
      <div class="choice" data-choice="claude" role="radio" tabindex="0">
        <span class="tag" data-t="b_best"></span><b data-t="b_claude"></b><span data-t="b_claude_s"></span>
        <button class="link" id="claude-action" type="button"></button>
      </div>
      <div class="choice" data-choice="opencode" role="radio" tabindex="0">
        <b data-t="b_free"></b><span data-t="b_free_s"></span>
      </div>
    </div>
    <p class="hint" id="brain-hint"></p>
    <div class="act"><button class="btn ghost" data-prev type="button" data-t="back"></button><button class="btn primary" data-next type="button" data-t="next"></button></div>
  </section>

  <section data-step="dl">
    <div class="kicker" data-t="step_dl"></div>
    <h1 class="t" data-t="dl_t"></h1>
    <p class="s" data-t="dl_s"></p>
    <div class="dls" id="dls"></div>
    <div class="total" id="total"></div>
    <p class="hint problem" id="dl-error" hidden></p>
    <div class="act">
      <button class="btn ghost" data-prev type="button" data-t="back"></button>
      <button class="btn ghost" id="dl-again" type="button" data-t="again" hidden></button>
      <button class="btn primary" data-next type="button" data-t="next" disabled></button>
    </div>
  </section>

  <section data-step="done">
    <h1 class="t" data-t="done_t"></h1>
    <p class="s" data-t="done_s"></p>
    <label class="name"><span data-t="done_name"></span><input id="name" type="text" maxlength="40" autocomplete="off" spellcheck="false"></label>
    <button class="check" id="autostart" type="button" role="checkbox" aria-checked="true"><span class="box"></span><span data-t="done_auto"></span></button>
    <p class="hint problem" id="done-error" hidden></p>
    <div class="act"><button class="btn ghost" data-prev type="button" data-t="back"></button><button class="btn primary" id="go" type="button" data-t="done_go"></button></div>
  </section>

  <section data-step="bye">
    <h1 class="t" data-t="bye_t"></h1>
  </section>
</main>

<nav class="steps" id="steps"></nav>
<script src="/static/setup.js"></script>
</body>
</html>
