# L'installatore costruito qui, dal codice del repository, e non su un PC: è la compilazione verificabile che chiede
# la firma gratuita di SignPath. Con un tag vX.Y.Z (uguale alla versione di pyproject.toml) crea anche la release con i
# file che cerca l'aggiornatore (jarvis/updates.py): Jarvis-Setup-X.Y.Z.exe e Jarvis-X.Y.Z.bundle. Le note della
# versione stanno in docs/versioni/X.Y.Z.md. Lanciato a mano costruisce soltanto (i file restano tra gli artefatti).
name: Installatore

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # per creare la release del tag

jobs:
  installatore:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.ref_name }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # il bundle porta tutta la storia: la copia installata ne fa il suo repository
      - uses: astral-sh/setup-uv@v6
        with:
          # l'installatore porta questo uv: sempre lo stesso, cambiato solo apposta e riprovato in un installatore vero
          # su un PC senza amministratore. La 0.13.9, presa da sola nella 0.1.0, dentro Inno Setup non preparava Python
          # (si inciampava nella sua junction in tools\python: errore 448); la 0.10.0, quella di uv.lock, sì
          version: "0.10.0"
      - name: Librerie (anche Playwright, per le immagini della procedura)
        run: uv sync --frozen
      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe")
          if (-not ($iscc | Where-Object { Test-Path $_ })) { choco install innosetup --no-progress -y }
      - name: Il tag è la versione del progetto
        if: env.IS_TAG == 'true'
        shell: pwsh
        run: |
          $v = uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ("v$v" -ne $env:TAG) { throw "il tag $env:TAG non è la versione $v di pyproject.toml" }
          if (-not (Test-Path "docs/versioni/$v.md")) { throw "mancano le note della versione: docs/versioni/$v.md" }
      - name: Costruisco
        run: uv run python scripts/build_installer.py
      - name: Impronte
        shell: pwsh
        run: |
          Get-ChildItem build -File | Where-Object { $_.Name -like "Jarvis-*" } | Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content build/SHA256SUMS.txt
          Get-Content build/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-installatore
          path: |
            build/Jarvis-Setup-*.exe
            build/Jarvis-*.bundle
            build/SHA256SUMS.txt
      - name: Release
        if: env.IS_TAG == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = $env:TAG.TrimStart("v")
          gh release create $env:TAG "build/Jarvis-Setup-$v.exe" "build/Jarvis-$v.bundle" build/SHA256SUMS.txt `
            --title "Jarvis $v" --notes-file "docs/versioni/$v.md" --verify-tag
